name: ContextGuard offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOON_HOME: ${{ github.workspace }}/.toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.7.0'
      - name: Install pinned official MoonBit archives
        run: python3 -B tools/bootstrap.py
      - name: Check, build, test all backends and verify registry consumer
        run: node tools/verify.mjs
      - name: Verify portable package
        run: python3 -B tools/package.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contextguard-verification-${{ github.sha }}
          path: |
            reports/
            dist/build-manifest.json
            release/*.zip
            release/*.sha256
          retention-days: 14
