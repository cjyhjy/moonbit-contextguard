name: ContextGuard offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOON_HOME: ${{ github.workspace }}/.toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Install pinned official MoonBit archives
        run: python3 -B tools/bootstrap.py
      - name: Build and verify local artifacts
        run: node tools/verify.mjs
      - name: Verify portable package
        run: python3 -B tools/package.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextguard-verification-${{ github.sha }}
          path: |
            reports/
            dist/build-manifest.json
            release/*.zip
            release/*.sha256
          retention-days: 14
