name: ContextGuard offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - name: Build and verify local artifacts
        run: node tools/verify.mjs
      - name: Verify portable package
        run: python3 -B tools/package.py
